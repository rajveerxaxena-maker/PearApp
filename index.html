<!DOCTYPE html>
<html lang="es"><head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#5a9a2f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PearApp</title>
<style>
:root{--bg:#f3f0ed;--card:#fff;--opt:#f3efec;--tx:#1f2328;--mut:#6b7280;--ac:#5a9a2f;--ok:#16a34a;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;display:flex;justify-content:center;align-items:center}
#app{width:min(92vw,420px);height:min(86vh,680px);overflow-y:auto;background:var(--card);border-radius:28px;padding:22px 18px;box-sizing:border-box;display:flex;flex-direction:column;text-align:center}
h1{font-size:27px;margin:10px 0 14px}
h2{font-size:19px;font-weight:500;margin:12px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.o{background:var(--opt);color:var(--tx);border:2px solid transparent;border-radius:16px;padding:14px;font-size:19px;margin:0 0 10px;width:100%;box-sizing:border-box}
.grid .o{margin:0}
.o.on,.o.good{background:var(--ac);color:#fff}
.o.good{background:var(--ok)}.o.err{background:var(--bad);color:#fff}
.l{text-align:left;font-size:21px}
.big{background:var(--ac);color:#fff;border:0;border-radius:22px;padding:17px;font-size:21px;margin-top:auto;width:100%}
.mut{color:var(--mut);font-size:14px}
.bar{height:8px;background:var(--opt);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.w{font-size:40px;font-weight:700;margin-top:18px}
.sp{background:none;border:0;font-size:26px;vertical-align:middle}
.tr{font-size:20px;color:var(--mut);margin-top:4px}
.rp{margin-top:6px;font-size:17px;font-weight:600;color:var(--ac)}
.em{font-size:110px;margin:18px 0 10px;line-height:1.1}
.rpg{font-size:14px;color:var(--mut);margin:4px 0 2px;font-weight:600}
.card{background:var(--opt);border-radius:22px;padding:18px;margin-top:16px;text-align:center}
.rk{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#8fc24a,#3f7a22);color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 6px 18px rgba(63,122,34,.35)}
.cc{text-align:left;margin-top:0}
.cc b{font-size:19px}
.o:disabled{opacity:.45}
.skip{background:none;border:0;color:var(--mut);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:600;position:sticky;top:-22px;background:var(--card);padding:6px 0 10px;z-index:2}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.cat{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-top:10px}
.ln{width:66px;height:66px;border-radius:50%;border:0;font-size:22px;font-weight:700;background:var(--opt);color:#b8b0aa}
.ln.d{background:var(--ac);color:#fff}
.ln.c{background:var(--ac);color:#fff;animation:p 1.4s infinite}
@keyframes p{50%{box-shadow:0 0 0 14px rgba(90,154,47,.3)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chips button{background:var(--opt);border:0;border-radius:12px;padding:12px 16px;font-size:20px;color:var(--tx)}
.chips button.err{background:var(--bad);color:#fff}
.chips button:disabled{opacity:.3}
.blank{font-size:34px;letter-spacing:6px;font-weight:700;margin:12px 0;min-height:44px}
input.t{width:100%;box-sizing:border-box;font-size:24px;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--opt);margin:14px 0 8px;background:var(--bg);color:var(--tx)}
</style></head><body><div id="app"></div>
<script>
const D={en:[["water","agua","💧"],["apple","manzana","🍎"],["bread","pan","🍞"],["milk","leche","🥛"],["house","casa","🏠"],["car","carro","🚗"],["dog","perro","🐶"],["cat","gato","🐱"],["sun","sol","☀️"],["moon","luna","🌙"],["tree","árbol","🌳"],["flower","flor","🌸"],["book","libro","📚"],["phone","teléfono","📱"],["key","llave","🔑"],["clock","reloj","⏰"],["egg","huevo","🥚"],["fish","pez","🐟"],["bird","pájaro","🐦"],["fire","fuego","🔥"],["rain","lluvia","🌧️"],["snow","nieve","❄️"],["heart","corazón","❤️"],["star","estrella","⭐"],["eye","ojo","👁️"],["hand","mano","✋"],["shoe","zapato","👟"],["hat","sombrero","🎩"],["banana","plátano","🍌"],["cheese","queso","🧀"],["pizza","pizza","🍕"],["coffee","café","☕"],["tea","té","🍵"],["bed","cama","🛏️"],["door","puerta","🚪"],["chair","silla","🪑"],["bike","bicicleta","🚲"],["plane","avión","✈️"],["boat","barco","⛵"],["train","tren","🚆"],["music","música","🎵"],["money","dinero","💰"],["gift","regalo","🎁"],["camera","cámara","📷"],["umbrella","paraguas","☂️"],["glasses","lentes","👓"],["cake","pastel","🎂"],["pencil","lápiz","✏️"],["computer","computadora","💻"],["beach","playa","🏖️"],["mountain","montaña","⛰️"]]};
const L=[["en","Inglés","en-US"],["fr","Francés","fr-FR"],["de","Alemán","de-DE"],["it","Italiano","it-IT"],["pt","Portugués","pt-BR"]];

/* Categorías de fácil a difícil. Cada lista va de palabra más usada a menos usada.
   Lo que no esté en ninguna lista va a "Otras" al final. */
const CATS=[
["Saludos y expresiones",["hello","hi","bye","goodbye","yes","no","please","thanks","sorry","welcome","okay","good","morning","night"]],
["Personas",["man","woman","boy","girl","child","baby","people","family","mother","father","brother","sister","son","daughter","friend"]],
["Casa",["house","home","door","window","bed","chair","table","room","kitchen","bathroom","key","floor","wall","roof"]],
["Comida y bebidas",["water","bread","milk","apple","banana","egg","cheese","pizza","coffee","tea","cake","food","rice","meat","juice","beer","wine","sugar","salt"]],
["Cuerpo",["hand","eye","head","face","hair","arm","leg","foot","heart","mouth","nose","ear"]],
["Animales",["dog","cat","bird","fish","horse","cow","pig","chicken","bear","lion"]],
["Naturaleza y tiempo",["sun","moon","star","tree","flower","rain","snow","wind","fire","mountain","beach","sky","river","sea","cloud","day","time","year"]],
["Ropa",["shirt","shoe","hat","dress","pants","jacket","glasses","bag"]],
["Transporte y viajes",["car","bike","plane","boat","train","bus","trip","hotel","airport","ticket","road","city","street","map"]],
["Ocio",["music","game","movie","sport","dance","party","gift","camera","song","play"]],
["Trabajo y estudio",["book","pencil","school","work","job","office","teacher","student","class","money","paper"]],
["Tecnología",["phone","computer","internet","screen","password","email","app","video"]],
["Adjetivos",["big","small","new","old","hot","cold","bad","fast","slow","beautiful","easy","hard","long","short"]],
["Verbos básicos",["go","come","see","make","take","give","know","think","look","use","find","tell","ask","try","want","need"]],
["Emociones",["love","happy","sad","angry","tired","afraid","hope","feel","like"]]
];
const STOP=new Set(["be","am","is","are","was","were","the","a","an","and","or","of","to","in","on","at","it","i","you","he","she","we","they","that","this","with","for","do","does","did","have","has","had"]);
const LV=[["😊","Fácil"],["😌","Normal"],["😠","Difícil"],["💀","Extremo"]];

let S={lang:"en",total:600,perDay:20,custom:{},p:{},cursed:{},diff:1,dlock:0,dunl:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("peach")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("peach",JSON.stringify(S))}catch(e){}};
const A=document.getElementById("app");
const lname=()=>L.find(x=>x[0]===S.lang)[1];
const lcode=()=>L.find(x=>x[0]===S.lang)[2];
const P=l=>(S.custom&&S.custom[l])||D[l]||[];
const pool=()=>P(S.lang).slice(0,S.total);
const K=()=>10;
const PR=()=>S.p[S.lang]||(S.p[S.lang]={n:0,streak:0,last:"",k:K()});
const today=()=>new Date().toLocaleDateString("sv");
const yest=()=>new Date(Date.now()-864e5).toLocaleDateString("sv");
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const RANKS=[["E",0],["D",1000],["C",3000],["B",8000],["A",18000],["S",68000]];
function maxXP(){const f=2000/(S.total||2000);let t=0;const cs=catsInfo(),les=lessons();cs.forEach((c,k)=>{const n=les.slice(c.start,c.end+1).reduce((a,l)=>a+l.words.length,0);const m=k<=0?1:k===1?3:k===2?5:k===3?10:10*2**(k-3);t+=n*4*m+100*MU(k)});return t*f}
function phase1Base(){const cs=catsInfo(),les=lessons();let t=0;cs.forEach((c,k)=>{const n=les.slice(c.start,c.end+1).reduce((a,l)=>a+l.words.length,0);const m=k<=0?1:k===1?3:k===2?5:k===3?10:10*2**(k-3);t+=n*m});return t}
function RG(){RANKS[5][1]=Math.max(18001,Math.round(phase1Base()+maxXP()));const x=S.xp||0,sT=RANKS[5][1];if(S.sssOK&&x>=sT)return {rank:"SSS",lvl:3,pc:100,x,hi:x};if(S.ssOK&&x>=sT)return {rank:"SS",lvl:3,pc:100,x,hi:x};let r=0;while(r<5&&x>=RANKS[r+1][1])r++;const lo=RANKS[r][1],hi=r<5?RANKS[r+1][1]:lo*10,st=(hi-lo)/3,k=Math.min(2,Math.floor((x-lo)/st)),pc=Math.min(100,Math.round(((x-lo)-k*st)/st*100));return {rank:RANKS[r][0],lvl:k+1,pc,x,hi}}
function gain(n){if(inExam)return;const k=2000/(S.total||2000),b=S.xp||0;S.xp=Math.max(0,b+Math.round(n*k));save();toastXP((S.xp||0)-b)}
function cxp(){const k=catsInfo().findIndex(c=>c.start<=cur&&cur<=c.end);return k<=0?1:k===1?3:k===2?5:k===3?10:10*2**(k-3)}
const canD=()=>!S.dlock||EX()>=catsInfo().length;
let note="",q=[],i=0,cur=0,curCat="",busy=false,lives=3,fails=[],mega=false,pwd=null,cnt=0;

/* Ordena la baraja por categoría (fácil a difícil) y arma las lecciones */
function ordered(){const base=pool().filter(w=>!STOP.has(w[0].toLowerCase()));
const buckets=CATS.map(()=>[]),other=[];
base.forEach(w=>{const k=w[0].toLowerCase();let f=-1,pos=0;if(w[4])f=CATS.findIndex(x=>x[0]===w[4]);
for(let c=0;c<CATS.length&&f<0;c++){const j=CATS[c][1].indexOf(k);if(j>=0){f=c;pos=j}}
if(f<0)other.push(w);else buckets[f].push([pos,w])});
const out=[];buckets.forEach((b,c)=>{if(b.length)out.push({cat:CATS[c][0],words:b.sort((a,b)=>a[0]-b[0]).map(x=>x[1])})});
if(other.length)out.push({cat:"Otras",words:other});return out}
function lessons(){const r=[];ordered().forEach(c=>{for(let s=0;s<c.words.length;s+=K())r.push({cat:c.cat,words:c.words.slice(s,s+K())})});return r}

function welcome(){A.innerHTML=`<svg viewBox="0 0 100 100" width="150" style="margin:70px auto 0"><circle cx="50" cy="68" r="26" fill="#a6c93a"/><circle cx="50" cy="40" r="15" fill="#a6c93a"/><circle cx="42" cy="62" r="8" fill="#c5dc6a" opacity=".6"/><path d="M50 27c0-8 2-14 6-18" stroke="#6b4a2d" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M54 18c8-6 16-4 20 0-8 5-16 4-20 0z" fill="#4c9a2a"/></svg><h1 style="margin-top:20px">PearApp</h1><div class="mut">Aprende idiomas palabra por palabra</div><button class="big" onclick="S.p[S.lang]&&pool().length?home():langScreen()">Comenzar</button>`}

function langScreen(){A.innerHTML=`<h1>Selecciona el idioma</h1>`+L.map((l,n)=>`<button class="o l ${S.lang===l[0]?"on":""}" onclick="S.lang='${l[0]}';langScreen()">${n+1}. ${l[1]}${S.lang===l[0]?" ✓":""}</button>`).join("")+`<button class="big" onclick="cfgScreen()">Continuar</button>`}

function cfgScreen(){const b=(k,v)=>`<button class="o ${S[k]===v?"on":""}" onclick="S.${k}=${v};cfgScreen()">${S[k]===v?"✓ ":""}${v}</button>`;
A.innerHTML=`<h1>Idioma seleccionado (${lname()})</h1><h2>Número de palabras</h2><div class="o on" style="text-align:center;font-weight:700;margin:0">2000 palabras</div><h2>Intensidad de los castigos</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)">${LV.map((l,k)=>`<button class="o ${S.diff===k?"on":""}" style="font-size:30px;padding:10px" ${canD()||S.diff===k?"":"disabled"} onclick="setD(${k})">${l[0]}</button>`).join("")}</div><div class="mut" style="margin-top:6px">${LV[S.diff][1]}${canD()?"":" · se puede cambiar al terminar la fase 1"}</div><div class="mut" style="margin-top:10px">${P(S.lang).length} palabras${S.custom[S.lang]?" (tu baraja)":" (de prueba)"} ${note}</div><label class="o" style="display:block;margin-top:10px;font-size:16px">📂 Cargar mi baraja (.txt o .csv)<input type="file" accept=".txt,.csv,.tsv,text/*" style="display:none" onchange="load(this.files[0])"></label><button class="o" onclick="S.xpNotif=!(S.xpNotif!==false);save();cfgScreen()">🔔 Avisos de XP: ${S.xpNotif!==false?"SÍ":"NO"}</button><button class="o" onclick="resetConfirm()">🔄 Empezar de cero</button><button class="o" onclick="expScreen()">💾 Exportar / importar progreso</button><div class="mut" style="margin-top:10px;line-height:1.5">📱 Para una mejor experiencia, toca los tres puntos del navegador, baja hasta “Instalar y crear acceso directo” y toca “Instalar”. Así PearApp aparece en tu teléfono como una app.</div><button class="big" style="margin-top:6px" onclick="start()">Empezar</button>`}

function nickScreen(){A.innerHTML=`<h1>Tu apodo</h1><input id="nk" class="t" maxlength="16" value="${(S.nick||"").replace(/"/g,"")}" placeholder="Escribe tu apodo"><button class="big" onclick="saveNick(document.getElementById('nk').value)">Guardar</button><button class="skip" onclick="home()">Cancelar</button>`}
function saveNick(v){S.nick=v.trim().slice(0,16);save();home()}
function resetConfirm(){A.innerHTML=`<div class="top"><button class="skip" onclick="cfgScreen()">← Ajustes</button><span>Empezar de cero</span><span></span></div><div class="em" style="margin-top:50px">⚠️</div><h1>¿Borrar todo?</h1><div class="mut">Se borrará tu progreso: XP, rango, nivel, categorías, exámenes, apodo, dificultad y la página volverá a empezar sin nombre. Esto no se puede deshacer.</div><div class="mut" style="margin-top:10px">Tu baraja cargada se conserva.</div><button class="big" style="background:#dc2626" onclick="resetAll()">Sí, borrar y empezar de nuevo</button><button class="o" style="margin-top:10px" onclick="cfgScreen()">Cancelar</button>`}
function resetAll(){try{localStorage.removeItem("peach")}catch(e){}const deck=S.custom||{};S={lang:"en",total:600,perDay:20,custom:deck,p:{},cursed:{},diff:1,dlock:0,xp:0};save();welcome()}
function expScreen(){const code=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,xp:S.xp||0,ex:S.ex||{},p:S.p,cursed:S.cursed,diff:S.diff,dlock:S.dlock,total:S.total,lang:S.lang}))));
A.innerHTML=`<h1>Progreso</h1><div class="mut">Copia este código y pégalo en el otro teléfono.</div><textarea id="ex" class="t" style="font-size:12px;height:110px" readonly>${code}</textarea><button class="o" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('ex').value);this.textContent='✓ Copiado'">📋 Copiar código</button><div class="mut" style="margin-top:14px">¿Tienes un código de otro teléfono? Pégalo aquí:</div><textarea id="im" class="t" style="font-size:12px;height:90px" placeholder="Pega el código"></textarea><button class="o" onclick="impText(document.getElementById('im').value)">📥 Cargar progreso</button><button class="big" onclick="cfgScreen()">Volver</button>`}
function impText(s){try{const d=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));if(!d||d.v!==1)throw 0;Object.assign(S,{xp:d.xp,ex:d.ex,p:d.p,cursed:d.cursed,diff:d.diff,dlock:d.dlock,total:d.total,lang:d.lang});save();alert('Progreso cargado');home()}catch(e){alert('Código no válido')}}
function setD(k){if(!canD())return;S.diff=k;S.dlock=1;S.dunl="";save();cfgScreen()}

function load(f){if(!f)return;const r=new FileReader();r.onload=()=>{const rows=String(r.result).split(/\r?\n/).map(l=>{l=l.replace(/<[^>]*>/g,"").replace(/&nbsp;/g," ").trim();if(!l||l[0]==="#")return null;const d=l.includes("\t")?"\t":l.includes(";")?";":",";const c=l.split(d).map(x=>x.trim().replace(/^"|"$/g,""));return c[0]&&c[1]?[c[0],c[1],c[2]&&c[2].length<=4?c[2]:"",c[3]||"",CATS.some(x=>x[0]===c[2])?c[2]:""]:null}).filter(Boolean);
if(!rows.length){note="No encontré palabras: usa dos columnas (palabra y traducción)";cfgScreen();return}const old=S.custom[S.lang]||[],seen=new Set(old.map(x=>x[0].toLowerCase()));S.custom[S.lang]=old.concat(rows.filter(x=>!seen.has(x[0].toLowerCase())));note="";save();cfgScreen()};r.readAsText(f)}

function start(){S.total=2000;save();if(!pool().length){note="Carga una baraja primero";cfgScreen();return}note="";const p=PR();if(p.k!==K()){p.n=0;p.k=K()}save();home()}

/* Pantalla principal: camino de lecciones agrupado por categoría. Sin bloqueo diario. */
function oldHome(){const p=PR(),les=lessons(),nl=les.length,t=today(),st=(p.last===t||p.last===yest())?p.streak:0;
const g=RG();let h=`<div class="top"><span>🔥 ${st}</span><span>${Math.min(p.n,nl)}/${nl}</span><button class="skip" onclick="langScreen()">⚙️ Ajustes</button></div><div class="rpg">Rango ${g.rank} · Nivel ${g.lvl}/8 · ${g.x} XP · ${g.rank==="SSS"?"Rango máximo":"siguiente rango a "+g.hi+" XP"}</div><div class="bar"><i style="width:${g.pc}%"></i></div>`;
if(p.n>=nl)h+=`<div class="mut">¡Completaste todo!</div><button class="o" style="margin-top:8px" onclick="PR().n=0;save();home()">Empezar otra vuelta</button>`;
h+=`<div class="path">`;let last="";
les.forEach((l,n)=>{if(l.cat!==last){last=l.cat;h+=`<div class="cat">${l.cat}</div>`}
const c=n===p.n,d=n<p.n;h+=`<button class="ln ${d?"d":c?"c":""}" style="transform:translateX(${Math.round(Math.sin(n*.9)*70)}px)" ${d||c?"":"disabled"} onclick="lesson(${n})">${n+1}</button>`});
A.innerHTML=h+`</div>`;
setTimeout(()=>{const e=A.querySelector(".c")||[...A.querySelectorAll(".d")].pop();if(e)e.scrollIntoView({block:"center"})},0)}

function catsInfo(){const out=[];lessons().forEach((l,n)=>{const last=out[out.length-1];if(!last||last.cat!==l.cat)out.push({cat:l.cat,start:n,end:n});else last.end=n});return out}

/* Inicio: rango, XP y botón Comenzar */
function buscar(q){const r=document.getElementById("bres");q=(q||"").trim().toLowerCase();if(!q){r.innerHTML="";return}
const L=P(S.lang).filter(w=>String(w[0]).toLowerCase().includes(q)||String(w[1]).toLowerCase().includes(q)).slice(0,8);
r.innerHTML=L.length?L.map(w=>`<div class="o" style="padding:10px;margin:0 0 8px;font-size:17px"><b>${w[0]}</b> · ${w[1]}</div>`).join(""):`<div class="mut">Sin resultados</div>`}

let xpPend=0,xpT=null;
function toastXP(d){if(!d||S.xpNotif===false)return;xpPend+=d;clearTimeout(xpT);xpT=setTimeout(()=>{const v=xpPend;xpPend=0;if(!v)return;const el=document.createElement("div");el.textContent=(v>0?"+":"−")+Math.abs(v)+" XP";el.style.cssText="position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:14px;font-weight:700;z-index:99;color:#fff;background:"+(v>0?"var(--ok)":"var(--bad)")+";box-shadow:0 4px 12px rgba(0,0,0,.2)";document.body.appendChild(el);setTimeout(()=>el.remove(),1600)},500)}
const RORD=["E","D","C","B","A","S","SS","SSS"];
function rankAtLeast(r){return RORD.indexOf(RG().rank)>=RORD.indexOf(r)}
const TROFEOS=[
{id:"t1",i:"👣",t:"Primer paso",d:"Completa tu primera lección",x:50,ok:()=>PR().n>=1},
{id:"t2",i:"📖",t:"5 lecciones",d:"Completa 5 lecciones",x:100,ok:()=>PR().n>=5},
{id:"t3",i:"📖",t:"20 lecciones",d:"Completa 20 lecciones",x:200,ok:()=>PR().n>=20},
{id:"t4",i:"📖",t:"50 lecciones",d:"Completa 50 lecciones",x:500,ok:()=>PR().n>=50},

function ooQ(){if(ooPz){ooQP();ooTB();return}const tr=ooSeq[ooT],opts=shuf(tr.o.map((t,j)=>[t,j===0]));window.ooCur=opts;ooBusy=false;
A.innerHTML=`<div class="top"><button class="skip" onclick="cats()">← Menú</button><span>❤️ ${S.inf.hearts}/5 · Nivel ${S.inf.lvl}</span><span></span></div><div class="w" style="font-size:22px;margin:14px 0">🧑 “${tr.w}”</div><div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px"><button class="o" style="width:auto;margin:0" onclick="sayR(ooSeq[ooT].w,1)">🔊 Escuchar</button><button class="o" style="width:auto;margin:0" onclick="sayR(ooSeq[ooT].w,0.6)">🐢 Lento</button></div>`+opts.map((x,i)=>`<button class="o" onclick="ooAns(${i})">${x[0]}</button>`).join("")+`<div id="dm" class="msg" style="min-height:26px;font-weight:600"></div>`;
setTimeout(()=>sayR(tr.w,1),250);ooTB()}
function ooAns(i){if(ooBusy)return;ooBusy=true;const [t,ok]=window.ooCur[i],m=document.getElementById("dm");
if(ok){m.style.color="var(--ok)";m.textContent="¡Correcto!";sayR(t,1);setTimeout(()=>{ooT++;if(ooT>=ooSeq.length)ooLevelDone();else ooQ()},1100)}
else{S.inf.hearts--;S.inf.perfect=false;m.style.color="var(--bad)";m.textContent="Era: "+ooSeq[ooT].o[0];sayR(ooSeq[ooT].o[0],1);save();setTimeout(()=>{if(S.inf.hearts<=0)ooOver();else{ooBuild();ooQ()}},2200)}}
function ooLevelDone(){const done=S.inf.lvl;S.inf.lvl++;S.inf.maxLvl=Math.max(S.inf.maxLvl||1,S.inf.lvl);if(S.inf.perfect&&S.inf.lvl>=5000)S.ssOK=true;if(S.inf.perfect&&S.inf.lvl>=10000)S.sssOK=true;save();if(done%50===0){ooZone(done);return}ooBuild();ooQ()}
let ooPos=0;
function ooQP(){const p=ooPz,hd=`<div class="top"><button class="skip" onclick="cats()">← Menú</button><span>❤️ ${S.inf.hearts}/5 · Nivel ${S.inf.lvl}</span><span></span></div>`;ooBusy=false;
if(p.t==="ws"){wsRender(hd);return}
if(p.t==="mc2"){mcRender(hd);return}
if(p.t==="scr"){ooPos=0;let L=p.word.split("");let sc=L.slice();do{sc=shuf(L)}while(sc.join("")===p.word&&L.length>1);
A.innerHTML=hd+`<div class="mut" style="margin-top:14px">Ordena las letras · ${p.meaning}</div><div class="blank" id="bl">${"_ ".repeat(p.word.length).trim()}</div><div class="chips">`+sc.map((c,k)=>`<button onclick="ooTap(this,'${c}')">${c}</button>`).join("")+`</div><div id="dm" class="msg" style="min-height:26px;font-weight:600"></div>`}
else{const idx=Math.floor(Math.random()*p.word.length);p.idx=idx;const ok=p.word[idx];const others=shuf("abcdefghijklmnopqrstuvwxyz".split("").filter(c=>c!==ok)).slice(0,2);const opts=shuf([ok,...others]);
A.innerHTML=hd+`<div class="mut" style="margin-top:14px">Completa la palabra · ${p.meaning}</div><div class="blank">${p.word.split("").map((c,k)=>k===idx?"_":c).join(" ")}</div><div class="chips">`+opts.map(c=>`<button onclick="ooTap(this,'${c}')">${c}</button>`).join("")+`</div><div id="dm" class="msg" style="min-height:26px;font-weight:600"></div>`}}
function ooTap(b,c){if(ooBusy)return;const p=ooPz,m=document.getElementById("dm");
if(p.t==="scr"){if(c===p.word[ooPos]){b.disabled=true;ooPos++;document.getElementById("bl").textContent=p.word.split("").map((x,k)=>k<ooPos?x:"_").join(" ");if(ooPos>=p.word.length){ooBusy=true;m.style.color="var(--ok)";m.textContent="¡Correcto!";setTimeout(ooLevelDone,700)}}else ooFailP(p.word,b)}
else{if(c===p.word[p.idx]){ooBusy=true;m.style.color="var(--ok)";m.textContent="¡Correcto!";setTimeout(ooLevelDone,700)}else ooFailP(p.word,b)}}
function ooFailP(word,b){if(ooBusy)return;ooBusy=true;S.inf.hearts--;S.inf.perfect=false;save();if(b){b.classList.add("err")}const m=document.getElementById("dm");if(m){m.style.color="var(--bad)";m.textContent="Era: "+word}setTimeout(()=>{if(S.inf.hearts<=0)ooOver();else{ooBuild();ooQ()}},1600)}
function ooOver(){S.inf.hearts=1;S.inf.lvl=1;S.inf.run=0;S.inf.perfect=true;save();const cp=S.inf.cp||0,can=cp>0&&(S.coins||0)>=cp;A.innerHTML=`<div class="em" style="margin-top:50px">💔</div><h1>Game over</h1><div class="mut">Te quedaste sin vidas.</div>${can?`<button class="big" onclick="ooRespawn(${cp})">Reaparecer en la zona ${cp} · ${cp} 🪙</button>`:""}<button class="o" style="margin-top:10px" onclick="ooBuild();ooQ()">Empezar desde nivel 1</button><button class="skip" onclick="cats()">Salir</button>`}
welcome();
</script></body></html>
